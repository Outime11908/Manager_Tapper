<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manager Tapper · Iniciar sesión</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body class="pagina-auth">
  <main class="auth-main">
    <section class="card auth-card">
      <h2>Manager Tapper</h2>
      {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label>Usuario
          <input type="text" name="username" required autofocus />
        </label>
        <label>Contraseña
          <input type="password" name="password" required />
        </label>
        <button type="submit">Entrar</button>
      </form>
      <a href="{{ url_for('terminos') }}" class="auth-terminos-link" target="_blank" rel="noopener">Términos y condiciones</a>
    </section>
  </main>
</body>
</html>
